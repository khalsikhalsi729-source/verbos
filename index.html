<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   RESET + TOKENS
══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* 11-tense chromatography palette */
  --t0:  #2B1055;
  --t1:  #451E5D;
  --t2:  #6B2366;
  --t3:  #912A67;
  --t4:  #B73260;
  --t5:  #D5414C;
  --t6:  #E65A35;
  --t7:  #F27A2B;
  --t8:  #FA9B36;
  --t9:  #FDBA4E;
  --t10: #FFE074;

  --accent: var(--t0);
  --accent-glow: #2B105522; 

  --font-display: 'Playfair Display', Georgia, serif;
  --font-ui: 'Outfit', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

[data-theme="dark"] {
  --bg:       #120621;  
  --bg-2:     #1b0a30;
  --bg-3:     #240e40;
  --bg-4:     #2B1055;  
  --border:   rgba(255, 224, 116, 0.1);  
  --border-2: rgba(255, 224, 116, 0.15);
  --text:     #fcf8f0;
  --text-2:   #d8cce6;
  --text-3:   #a58ec2;  
  --shadow:   0 8px 40px rgba(18, 6, 33, 0.8);
  --active-verb-color: var(--t4);
}

 
[data-theme="light"] {
  --bg:       #fcfbfe;  
  --bg-2:     #ffffff;
  --bg-3:     #f4f1f8;
  --bg-4:     #ebe6f2;
  --border:   rgba(43, 16, 85, 0.08);
  --border-2: rgba(43, 16, 85, 0.12);
  --text:     #1A0833; 
  --text-2:   #451E5D;  
  --text-3:   #7d6799;  
  --shadow:   0 4px 24px rgba(43, 16, 85, 0.08);
  --active-verb-color: var(--t0)
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  transition: background 0.35s, color 0.35s;
}

/* ══════════════════════════════════════════════
   LAYOUT SKELETON
══════════════════════════════════════════════ */
.app {
  display: grid;
  grid-template-rows: 52px 1fr;
  grid-template-columns: clamp(200px, 20vw, 240px) 1fr; 
  height: 100vh;
}

/* ══════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════ */
header {
  grid-column: 1 / -1;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 14px;
  z-index: 20;
}

.logo {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 60px;
  letter-spacing: -0.5px;
  background: linear-gradient(100deg, var(--t0) 0%, var(--t4) 50%, var(--t8) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
  flex-shrink: 0;
}

.search-box {
  position: relative;
  flex: 1;
  max-width: clamp(150px, 25vw, 300px); 
}
.search-box svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
}
.search-box input {
  width: 100%;
  padding: 7px 12px 7px 34px;
  border-radius: 8px;
  border: 1px solid var(--border-2);
  background: var(--bg-3);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-box input::placeholder { color: var(--text-3); }

.hdr-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid var(--border-2);
  background: var(--bg-3);
  color: var(--text-3);
  white-space: nowrap;
}

.btn-icon {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border-2);
  background: var(--bg-3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  color: var(--text-2);
  transition: all 0.2s;
}
.btn-icon:hover { background: var(--bg-4); color: var(--text); }
.btn-icon.active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }

/* ══════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════ */
.sidebar {
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-title {
  padding: 12px 14px 6px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--text-3);
}

.legend {
  display: flex;
  gap: 10px;
  padding: 4px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: var(--text-3);
}
.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
.dot-r { background: #10b981; }
.dot-i { background: #f97316; }
.dot-x { background: #a855f7; }

.verb-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.verb-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.15s;
  margin-bottom: 1px;
}
.verb-item:hover { background: var(--bg-4); }
.verb-item.active { background: var(--accent-glow); }
.verb-item.hidden { display: none; }

.verb-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.verb-texts { min-width: 0; }
.verb-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  transition: color 0.2s;
}
.verb-item.active .verb-name { color: var(--active-verb-color, var(--accent)); font-weight: 600; }
.verb-sub {
  font-size: 10px;
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ══════════════════════════════════════════════
   MAIN PANEL
══════════════════════════════════════════════ */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Subtle color wash background */
.main::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 50% at 70% 30%, var(--accent-glow), transparent);
  pointer-events: none;
  transition: background 0.6s;
  z-index: 0;
}

/* ══════════════════════════════════════════════
   CHROMATOGRAPHY BAR
══════════════════════════════════════════════ */
.chroma-strip {
  height: 80px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: stretch;
  gap: 4px;
  flex-shrink: 0;
  position: relative;
  z-index: 5;
  overflow: hidden;
}

/* Faint full-spectrum wash behind the bar */
.chroma-strip::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,
    #2B1055, #451E5D, #6B2366, #912A67, #B73260,
    #D5414C, #E65A35, #F27A2B, #FA9B36, #FDBA4E, #FFE074
  );
  opacity: 0.06;
  pointer-events: none;
}

.tense-seg {
  flex: 1;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  transition: all 0.22s cubic-bezier(.4,0,.2,1);
  color: var(--text);
  opacity: 0.6;
  position: relative;
  padding: clamp(4px, 1vh, 8px) clamp(2px, 0.5vw, 4px); 
  border: 1.5px solid transparent;
  border-bottom: 3px solid transparent;
  user-select: none;
}

.tense-seg:hover {
  opacity: 0.9;
  transform: translateY(-2px);
}

.tense-seg.active {
  opacity: 1;
  transform: translateY(-2px) scaleY(1.02);
  border-color: transparent;
  border-bottom-color: var(--chroma-color);  
  box-shadow: 0 10px 20px -8px var(--chroma-color);
} 

.tense-seg::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 10px;
  background: var(--chroma-color);
  opacity: 0;
  filter: blur(8px);
  transition: opacity 0.3s;
  z-index: -1;
}
.tense-seg.active::after { opacity: 0.25; }
.tense-seg:hover::after { opacity: 0.1; }

.seg-main { 
  font-size: clamp(7.5px, 0.8vw, 9px); 
  opacity: 0.9; 
}

.seg-sub  { 
  font-size: clamp(8px, 0.9vw, 10px); 
  font-weight: 700; 
}

/* ══════════════════════════════════════════════
   CONTENT AREA
══════════════════════════════════════════════ */
.content {
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* ─── SINGLE VIEW ─── */
.view-single {
  height: 100%;
  overflow-y: auto;
  padding: 28px 36px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.conj-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 20px;
  animation: slideUp 0.28s ease both;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0);    }
}

.verb-hero {
  font-family: var(--font-display);
  font-size: clamp(32px, 4vw, 52px); 
  font-weight: 900;
  letter-spacing: -2px;
  color: var(--accent);
  line-height: 1;
  transition: color 0.35s;
}

.verb-hero-sub {
  font-size: 14px;
  color: var(--text-3);
  margin-top: 6px;
  font-style: italic;
}

.tense-label-box { text-align: right; }
.tense-label-main {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: color 0.35s;
}
.tense-label-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
}

/* ─── CONJUGATION TABLE ─── */
.conj-table {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  animation: slideUp 0.3s ease 0.05s both;
}

.conj-row {
  display: grid;
  grid-template-columns: 140px 1fr;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  animation: rowFade 0.3s ease both;
}
@keyframes rowFade {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}
.conj-row:last-child { border-bottom: none; }
.conj-row:hover { background: var(--accent-glow); }

.conj-pronoun {
  padding: clamp(10px, 2vh, 14px) clamp(10px, 2vw, 18px);
  font-size: clamp(11px, 1.2vw, 12.5px);  
  font-weight: 500;
  color: var(--text-3);
  border-right: 2px solid var(--accent);
  display: flex;
  align-items: center;
  transition: border-color 0.35s;
  opacity: 0.85;
}

.conj-form {
  padding: clamp(10px, 2vh, 14px) clamp(12px, 2vw, 22px);
  font-family: var(--font-mono);
  font-size: clamp(14px, 1.5vw, 18px);  
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  letter-spacing: -0.3px;
}

.form-stem { color: var(--text-2); }
.form-end  { color: var(--accent); font-weight: 700; transition: color 0.35s; }

/* ─── PANORAMA VIEW ─── */
.view-panorama {
  height: 100%;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
.view-panorama.active { display: flex; }
.view-single.hidden   { display: none; }

.panorama-scroll {
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  align-items: stretch;
  gap: 0;
  padding: 16px 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.pano-col {
  flex-shrink: 0;
  width: 190px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  padding-right: 0;
  animation: slideUp 0.3s ease both;
}
.pano-col:last-child { border-right: none; }

.pano-header {
  padding: 8px 14px 10px;
  border-bottom: 3px solid;
  margin-bottom: 0;
}
.pano-tense-main {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  opacity: 0.7;
}
.pano-tense-sub {
  font-size: 11px;
  font-weight: 700;
  margin-top: 1px;
}

.pano-rows { flex: 1; }
.pano-row {
  display: flex;
  flex-direction: column;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.pano-row:hover { background: var(--bg-4); }
.pano-row:last-child { border-bottom: none; }

.pano-pronoun {
  font-size: 9px;
  color: var(--text-3);
  text-transform: lowercase;
  margin-bottom: 2px;
}
.pano-form {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ─── EMPTY STATE ─── */
.empty {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--text-3);
}
.empty-glyph {
  font-family: var(--font-display);
  font-size: 80px;
  font-style: italic;
  opacity: 0.08;
  line-height: 1;
}
.empty-msg { font-size: 13px; }

/* ══════════════════════════════════════════════
   NAV BAR
══════════════════════════════════════════════ */
.nav-bar {
  background: var(--bg-2);
  border-top: 1px solid var(--border);
  padding: 10px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 5;
}

.nav-btn {
  padding: 7px 16px;
  border-radius: 8px;
  border: 1px solid var(--border-2);
  background: var(--bg-3);
  color: var(--text-2);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font-ui);
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s;
}
.nav-btn:hover:not(:disabled) {
  background: var(--accent-glow);
  color: var(--accent);
  border-color: var(--accent);
}
.nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

.nav-center {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-progress { font-size: 12px; color: var(--text-3); }
.kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-3);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border-2);
  background: var(--bg-4);
}

/* ══════════════════════════════════════════════
   SCROLLBARS
══════════════════════════════════════════════ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

/* ══════════════════════════════════════════════
   TRANSITIONS
══════════════════════════════════════════════ */
.fade-enter { animation: fadeIn 0.25s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════════════════════
   RESPONSIVE DESIGN (MÓVIL & TABLET)
══════════════════════════════════════════════ */

.menu-btn {
  display: none;
}

@media (max-width: 768px) {
  .app {
    grid-template-columns: 1fr;  
  }

  .menu-btn {
    display: flex; 
  }

  .sidebar {
    position: fixed;
    top: 52px;
    left: -100%;  
    width: 260px;
    height: calc(100vh - 52px);
    z-index: 100;
    transition: left 0.3s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,0.1);
  }
  .sidebar.open {
    left: 0;  
  }

   .chroma-strip {
    overflow-x: auto;
    justify-content: flex-start;
    padding: 10px;
  }
  .tense-seg {
    min-width: 70px;  
    flex: 0 0 auto;
  }

  
  .search-box { max-width: 130px; }
  .search-box input { font-size: 11px; padding: 6px 10px 6px 30px; }
  .verb-hero { font-size: 38px; }
  .view-single { padding: 15px 15px 12px; }
  
  .conj-row { grid-template-columns: 90px 1fr; }  
  .conj-pronoun { padding: 12px 10px; font-size: 11px; }
  .conj-form { padding: 12px 15px; font-size: 15px; }

   .kbd { display: none; }
  .nav-bar { padding: 10px 15px; }
  
 
  @media (max-width: 480px) {
    .badge { display: none; }
    .logo { font-size: 15px; }
  }
}
</style>
</head>
<body>

<div class="app">

  <!-- ── HEADER ── -->
  <header>
    <button class="btn-icon menu-btn" id="menuBtn" title="Menú">☰</button>
    
    <div class="logo">Nexo</div>

    <div class="search-box">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Buscar verbo…" autocomplete="off">
    </div>

    <div class="hdr-actions">
      <span class="badge" id="countBadge"></span>
      <button class="btn-icon" id="panoramaBtn" title="Vista panorama (P)">⊞</button>
      <button class="btn-icon" id="themeBtn" title="Cambiar tema (T)">☀️</button>
    </div>
  </header>

   
  <aside class="sidebar">
    <div class="sidebar-title">Verbos</div>
    <!-- <div class="legend">
      <div class="legend-item"><div class="dot dot-r"></div>Regular</div>
      <div class="legend-item"><div class="dot dot-i"></div>Irregular</div>
      <div class="legend-item"><div class="dot dot-x"></div>Reflexivo</div>
    </div> -->
    <div class="verb-list" id="verbList"></div>
  </aside>  

  <!-- ── MAIN ── -->
  <main class="main">

    <!-- Chromatography tense strip -->
    <div class="chroma-strip" id="chromaStrip"></div>

    <!-- Content views -->
    <div class="content">
      <div class="view-single" id="viewSingle">
        <div class="empty">
          <div class="empty-glyph">V</div>
          <div class="empty-msg">Selecciona un verbo para comenzar</div>
        </div>
      </div>
      <div class="view-panorama" id="viewPanorama"></div>
    </div>

    <!-- Nav bar -->
    <div class="nav-bar">
      <button class="nav-btn" id="btnPrevVerb">← Anterior</button>
      <div class="nav-center">
        <span class="nav-progress" id="navProgress"></span>
        <span class="kbd">↑↓ verbos</span>
        <span class="kbd">← → tiempos</span>
        <span class="kbd">P panorama</span>
      </div>
      <button class="nav-btn" id="btnNextVerb">Siguiente →</button>
    </div>
  </main>

</div>

<script>
/* ════════════════════════════════════════════
   DATA — 11 TENSES
════════════════════════════════════════════ */
const TENSES = [
  { key:'presente',             name:'Presente',   sub:'Indicativo',       color:'#2B1055' },
  { key:'indefinido',           name:'Pretérito',  sub:'Indefinido',       color:'#451E5D' },
  { key:'imperfecto',           name:'Pretérito',  sub:'Imperfecto',       color:'#6B2366' },
  { key:'perfecto',             name:'Pretérito',      sub:'Perfecto',         color:'#912A67' },
  { key:'pluscuamperfecto',     name:'Pretérito',      sub:'Pluscuamperfecto', color:'#B73260' },
  { key:'futuroSimple',         name:'Futuro',     sub:'Simple',           color:'#D5414C' },
  { key:'futuroCompuesto',      name:'Futuro',     sub:'Compuesto',         color:'#E65A35' },
  { key:'condicional',          name:'Condicional',      sub:'Simple',           color:'#F27A2B' },

// Smart split: highlight endings for simple tenses
function splitForm(form) {
  if (!form) return { stem:'—', end:'' };
  if (form.includes(' ')) return { stem: form, end: '' }; // compound
  const ENDINGS = ['aba','ías','íamos','abais','aban','abas',
                   'aron','asteis','aron','amos','ais','an',
                   'ría','rías','ría','ríamos','ríais','rían',
                   'ra','ras','ramos','rais','ran',
                   'é','ás','á','éis','án',
                   'o','es','e','emos','éis','en',
                   'ó','ste','mos','steis'];
  ENDINGS.sort((a,b) => b.length - a.length);
  for (const e of ENDINGS) {
    if (form.endsWith(e) && form.length > e.length) {
      return { stem: form.slice(0, -e.length), end: e };
    }
  }
  return { stem: form, end: '' };
}

function dotClass(type) {
  return type === 'irregular' ? 'dot-i' : type === 'reflexive' ? 'dot-x' : 'dot-r';
}

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */
function renderSidebar() {
  const list  = document.getElementById('verbList');
  const badge = document.getElementById('countBadge');
  badge.textContent = `${S.filtered.length} / ${VERBS.length} verbos`;

  list.innerHTML = VERBS.map((v, i) => {
    const inFilter = S.filtered.includes(v);
    return `<div class="verb-item ${i === S.verbIdx ? 'active' : ''} ${inFilter ? '' : 'hidden'}"
                 data-i="${i}" onclick="selectVerb(${i})">
      
      <div class="verb-texts">
        <div class="verb-name">${v.infinitive}</div>
        <div class="verb-sub">${v.translation}</div>
      </div>
    </div>`;
  }).join('');
}

function renderChroma() {
  const strip = document.getElementById('chromaStrip');
  strip.innerHTML = TENSES.map((t, i) => `
    <div class="tense-seg ${i === S.tenseIdx ? 'active' : ''}"
         style="--chroma-color: ${t.color}; background: ${t.color}22;"
         onclick="selectTense(${i})">
      <span class="seg-main">${t.name}</span>
      <span class="seg-sub">${t.sub}</span>
    </div>
  `).join('');
}

function renderSingle() {
  const area = document.getElementById('viewSingle');
  if (S.verbIdx === null) {
    area.innerHTML = `<div class="empty">
      <div class="empty-glyph">V</div>
      <div class="empty-msg">Selecciona un verbo para comenzar</div>
    </div>`;
    return;
  }

  const verb  = VERBS[S.verbIdx];
  const tense = TENSES[S.tenseIdx];
  const forms = verb[tense.key] || [];

  // حيدنا splitForm ورجعنا الكلمة كاملة بلون var(--text)
  const rows = PRONOUNS.map((p, i) => {
    return `<div class="conj-row" style="animation-delay:${i*35}ms">
      <div class="conj-pronoun">${p}</div>
      <div class="conj-form"><span style="color:var(--text)">${forms[i] || '—'}</span></div>
    </div>`;
  }).join('');

  const pos = S.filtered.indexOf(verb);
  document.getElementById('navProgress').textContent =
    pos >= 0 ? `${pos+1} / ${S.filtered.length}` : '';

  area.innerHTML = `
    <div class="conj-header">
      <div>
        <div class="verb-hero">${verb.infinitive}</div>
        <div class="verb-hero-sub">${verb.translation}</div>
      </div>
      <div class="tense-label-box">
        <div class="tense-label-main">${tense.name}</div>
        <div class="tense-label-sub">${tense.sub}</div>
      </div>
    </div>
    <div class="conj-table">${rows}</div>
  `;
}

function renderPanorama() {
  const wrap = document.getElementById('viewPanorama');
  if (S.verbIdx === null) {
    wrap.innerHTML = `<div class="empty" style="height:100%">
      <div class="empty-glyph">⊞</div>
      <div class="empty-msg">Selecciona un verbo para ver la panorama</div>
    </div>`;
    return;
  }
  const verb = VERBS[S.verbIdx];

  const cols = TENSES.map((t, ti) => {
    const forms = verb[t.key] || [];
    const rows = PRONOUNS.map((p, pi) => `
      <div class="pano-row">
        <div class="pano-pronoun">${p}</div>
        <div class="pano-form" style="color:${ti===S.tenseIdx?t.color:'var(--text)'}">
          ${forms[pi] || '—'}
        </div>
      </div>
    `).join('');
    return `<div class="pano-col" style="animation-delay:${ti*25}ms">
      <div class="pano-header" style="border-color:${t.color}; color:${t.color}">
        <div class="pano-tense-main">${t.name}</div>
        <div class="pano-tense-sub">${t.sub}</div>
      </div>
      <div class="pano-rows">${rows}</div>
    </div>`;
  }).join('');

  wrap.innerHTML = `<div class="panorama-scroll">${cols}</div>`;
}

function renderNavBtns() {
  const verb = S.verbIdx !== null ? VERBS[S.verbIdx] : null;
  const pos  = verb ? S.filtered.indexOf(verb) : -1;
  document.getElementById('btnPrevVerb').disabled = pos <= 0;
  document.getElementById('btnNextVerb').disabled = pos < 0 || pos >= S.filtered.length - 1;
}

function render() {
  renderSidebar();
  renderChroma();
  if (S.panorama) renderPanorama();
  else renderSingle();
  renderNavBtns();
}

/* ════════════════════════════════════════════
   ACTIONS
════════════════════════════════════════════ */
function selectVerb(i) {
  S.verbIdx = i;
  setAccent(TENSES[S.tenseIdx].color);
  render();
  
  document.querySelector('.sidebar').classList.remove('open');
  
  requestAnimationFrame(() => {
    document.querySelector(`[data-i="${i}"]`)
      ?.scrollIntoView({ block:'nearest', behavior:'smooth' });
  });
}

function selectTense(i) {
  S.tenseIdx = i;
  setAccent(TENSES[i].color);
  render();
}

function navigateVerb(dir) {
  const verb = S.verbIdx !== null ? VERBS[S.verbIdx] : null;
  const pos  = verb ? S.filtered.indexOf(verb) : -1;
  if (pos + dir >= 0 && pos + dir < S.filtered.length) {
    selectVerb(VERBS.indexOf(S.filtered[pos + dir]));
  } else if (pos === -1 && S.filtered.length > 0) {
    selectVerb(VERBS.indexOf(S.filtered[0]));
  }
}

function togglePanorama() {
  S.panorama = !S.panorama;
  document.getElementById('panoramaBtn').classList.toggle('active', S.panorama);
  document.getElementById('viewSingle').classList.toggle('hidden', S.panorama);
  document.getElementById('viewPanorama').classList.toggle('active', S.panorama);
  render();
}

function toggleTheme() {
  S.theme = S.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', S.theme);
  document.getElementById('themeBtn').textContent = S.theme === 'light' ? '🌙' : '☀️';
}

/* ════════════════════════════════════════════
   EVENTS
════════════════════════════════════════════ */
document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  S.filtered = q
    ? VERBS.filter(v => v.infinitive.toLowerCase().includes(q)) 
    : [...VERBS];
  render();
});

document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('panoramaBtn').addEventListener('click', togglePanorama);
document.getElementById('btnPrevVerb').addEventListener('click', () => navigateVerb(-1));
document.getElementById('btnNextVerb').addEventListener('click', () => navigateVerb(1));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (k === 'ArrowDown')  { e.preventDefault(); navigateVerb(1); }
  if (k === 'ArrowUp')    { e.preventDefault(); navigateVerb(-1); }
  if (k === 'ArrowRight') { e.preventDefault(); selectTense((S.tenseIdx + 1) % 11); }
  if (k === 'ArrowLeft')  { e.preventDefault(); selectTense((S.tenseIdx + 10) % 11); }
  if (k === 'p' || k === 'P') togglePanorama();
  if (k === 't' || k === 'T') toggleTheme();
});

document.getElementById('menuBtn').addEventListener('click', () => {
  document.querySelector('.sidebar').classList.toggle('open');
});

/* ════════════════════════════════════════════
   BOOT
════════════════════════════════════════════ */
setAccent(TENSES[0].color);
selectVerb(0);
</script>
</body>
</html>
